<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

<style>
:root{--bg:#fff;--fg:#1d1d21;--mut:#6b6b70;--line:#e3e3e8;--card:#f7f7f9}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#ececf0;--mut:#9a9aa3;--line:#2a2a30;--card:#1d1d21}}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{display:flex;height:100%}#map{flex:1}
aside{width:390px;max-width:44vw;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 16px;border-bottom:1px solid var(--line)}h1{font-size:17px;margin:0 0 4px}.sub{color:var(--mut);font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.filters button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:14px;padding:4px 10px;font-size:12px;cursor:pointer}
.filters button.on{background:var(--fg);color:var(--bg)}
details.about{margin-top:10px;font-size:12px;color:var(--mut)}details.about summary{cursor:pointer;color:var(--fg);font-weight:600}
.list{overflow:auto;flex:1}.item{padding:9px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:10px;align-items:flex-start}
.item:hover{background:var(--card)}.dot{width:12px;height:12px;border-radius:50%;margin-top:4px;flex:none}
.t{font-weight:600}.m{color:var(--mut);font-size:12px}.pv{font-weight:700}.warn{color:#d97706}.ok{color:#16a34a}
.lab{background:rgba(0,0,0,.72);color:#fff;border:0;border-radius:4px;padding:1px 5px;font-size:11px;font-weight:600;box-shadow:none}.lab:before{display:none}
.legend{background:var(--bg);color:var(--fg);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.3);max-width:280px}
.legend span{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--fg)}.pop{font-size:12.5px;max-width:330px}.pop h3{margin:0 0 4px;font-size:14px}.pop .k{color:var(--mut)}.pop hr{border:0;border-top:1px solid var(--line);margin:6px 0}
@media (max-width:700px){.wrap{flex-direction:column}aside{width:100%;max-width:none;height:46%}#map{height:54%}}
</style></head><body><div class="wrap"><aside><header><h1>Camper lots</h1>

etry": {"type": "Polygon", "coordinates": [[[-92.81579, 37.952087], [-92.815985, 37.951949], [-92.81607, 37.952022], [-92.815874, 37.952158], [-92.81579, 37.952087]]]}, "properties": {"name": "Vehlings Niangua Beach Lot 116, Blk B", "parcel": "18-4.0-17.0-001.0-000-009.000", "acres": 0.062, "price": 15000, "feature": "Community river access"}}, {"type": "Feature", "geometry": {"type": "Polygon", "coordinates": [[[-93.031068, 38.198575], [-93.031073, 38.198506], [-93.031078, 38.198438], [-93.031084, 38.198369], [-93.031171, 38.198373], [-93.031257, 38.198377], [-93.031344, 38.198382], [-93.031339, 38.19845], [-93.031334, 38.198519], [-93.031247, 38.198514], [-93.031241, 38.198583], [-93.031236, 38.198652], [-93.031149, 38.198647], [-93.031063, 38.198643], [-93.031068, 38.198575]]]}, "properties": {"name": "Pine Cove 4th Add, Blk 1, Lots 84-93", "parcel": "04-8.0-33.0-001.0-007-003.000", "acres": 0.143, "price": 6000, "feature": "Ten lots together"}}]};
const COL='#16a34a';
const money=n=>n==null?'—':'$'+Math.round(n).toLocaleString();
const map=L.map('map',{zoomControl:true});
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Imagery © Esri'}).addTo(map);
const st=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
L.control.layers({'Satellite':sat,'Streets':st}).addTo(map);
const layers=[];
function popup(p){
 return `<div class="pop"><h3>${p.name}</h3><div><span class="k">Parcel</span> ${p.parcel}</div>
 <div><span class="k">Size</span> ${(+p.acres).toFixed(p.acres>=0.1?2:3)} acres</div>
 ${p.feature?`<div style="margin-top:3px"><b>${p.feature}</b></div>`:''}
 <div style="margin-top:4px"><span class="k">Price</span> <b>${money(p.price)}</b></div></div>`}
DATA.features.forEach(f=>{const p=f.properties;const col=COL;
 const poly=L.geoJSON(f,{style:{color:col,weight:3,fillColor:col,fillOpacity:.4}});const c=poly.getBounds().getCenter();
 const pin=L.circleMarker(c,{radius:7,color:'#fff',weight:2,fillColor:col,fillOpacity:1});const lyr=L.featureGroup([poly,pin]);
 lyr.bindPopup(popup(p),{maxWidth:340});
 const tip=L.tooltip({permanent:true,direction:'top',offset:[0,-8],className:'lab'}).setContent(money(p.price)).setLatLng(c);
 layers.push({f,lyr,tip,c})});
function labels(){const z=map.getZoom();layers.forEach(({f,tip})=>{const show=z>=13;if(show)tip.addTo(map);else map.removeLayer(tip)})}
map.on('zoomend',labels);
function render(){ const list=document.getElementById('list');list.innerHTML='';const vis=[];
 layers.forEach(({f,lyr,c})=>{const p=f.properties;const show=true;
  if(show){lyr.addTo(map);vis.push(lyr)}else map.removeLayer(lyr);if(!show)return;
  const it=document.createElement('div');it.className='item';
  it.innerHTML=`<div class="dot" style="background:${COL}"></div><div><div class="t">${p.name}</div><div class="m">${(+p.acres).toFixed(p.acres>=0.1?2:3)} ac${p.feature?' · '+p.feature:''}<br><b>${money(p.price)}</b></div></div>`;
  it.onclick=()=>{map.fitBounds(lyr.getBounds(),{maxZoom:18});lyr.openPopup()};list.appendChild(it)});
 map.invalidateSize();if(vis.length)map.fitBounds(L.featureGroup(vis).getBounds(),{padding:[30,30]});labels()}
map.setView([38.1,-92.75],10);render();let fitted=0;new ResizeObserver(()=>{if(fitted<3){fitted++;render()}}).observe(document.getElementById('map'));setTimeout(render,800);
